[package]
name = "aegis"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Open-source GIS in Rust — pan, zoom, query a map in the browser or natively, from one codebase."
repository = "https://github.com/timthirion/aeGIS"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
# Core renderer + GPU
wgpu = "29"
bytemuck = { version = "1.16", features = ["derive"] }
thiserror = "2"
log = "0.4"

# PNG decode for raster tiles + JPEG for the bundled Blue Marble
# Earth texture (JPEG is 1/7th the size of an equivalent PNG and
# satellite imagery has no flat-colour regions for JPEG to artifact).
# Both decoders are pure-Rust.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# GeoJSON parsing for the M3 vector overlay. Pure-Rust; works on
# wasm32 with no extra config.
geojson = { version = "0.24", default-features = false }

# Coordinate-format pattern matching for the search bar
# (plan 0002 M0). Pure-Rust; works on wasm32.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }

# JSON parsing for the geocoder client (plan 0002 M1). Pure-Rust.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SGP4 orbital propagation for the satellite overlay (plan 0004 M0).
# Pure-Rust; works on wasm32. The de-facto reference Rust port of
# the Vallado SGP4/SDP4 model.
sgp4 = "2.4"

# Date/time math for the TLE epoch → UNIX-seconds conversion in
# `src/orbit.rs`. sgp4 already brings chrono in transitively; we
# declare it here so the explicit use is honest.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.29"
pollster = "0.3"
env_logger = "0.11"
# Native HTTP for the OSM tile fetch (uses `ureq` under the hood). On
# web we use `web_sys::fetch` + `wasm_bindgen_futures::spawn_local`
# directly because ehttp's web path requires `Send` closures, which
# don't compose with our single-threaded `Rc<RefCell<...>>` web state.
ehttp = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "MouseEvent",
  "Node",
  "PointerEvent",
  "Window",
  "Performance",
  "WheelEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  "DomRect",
  "DomRectReadOnly",
  "Response",
  "Request",
  "RequestInit",
  "console",
] }
console_error_panic_hook = "0.1"
console_log = "1"

[dev-dependencies]
naga = { version = "26", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
