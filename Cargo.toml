[package]
name = "aegis"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Open-source GIS in Rust — pan, zoom, query a map in the browser or natively, from one codebase."
repository = "https://github.com/timthirion/aegis"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aegis"
path = "src/main.rs"
# Skip the native binary on wasm; it depends on winit's native event loop.
required-features = []

[dependencies]
# Core renderer + GPU
wgpu = "29"
bytemuck = { version = "1.16", features = ["derive"] }
thiserror = "2"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
pollster = "0.4"
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Window",
  "console",
] }
console_error_panic_hook = "0.1"
console_log = "1"

[dev-dependencies]
naga = { version = "26", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
