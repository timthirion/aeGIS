<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aeGIS</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0e12;
      color: #e6e8eb;
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
    }
    header, footer {
      padding: 12px 18px;
    }
    header {
      border-bottom: 1px solid #1d232b;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header .tag {
      font-size: 12px;
      color: #8d97a3;
      font-variant-numeric: tabular-nums;
    }
    main {
      position: relative;
      overflow: hidden;
    }
    #aegis-host {
      position: absolute;
      inset: 0;
    }
    #aegis-host canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    footer {
      border-top: 1px solid #1d232b;
      font-size: 12px;
      color: #8d97a3;
    }
    footer a { color: #9cb2cf; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>aeGIS</h1>
    <span class="tag" id="version-tag">loading…</span>
  </header>
  <main>
    <div id="aegis-host"></div>
  </main>
  <footer>
    <span>aeGIS · M0 pixel pass · Open-source GIS in Rust + WebGPU</span>
    &nbsp;·&nbsp;
    <a href="https://github.com/timthirion/aeGIS">github.com/timthirion/aeGIS</a>
  </footer>
  <script type="module">
    import init, { start, version } from "./pkg/aegis.js";

    async function main() {
      await init();
      document.getElementById("version-tag").textContent = `v${version()}`;
      try {
        await start("aegis-host");
      } catch (e) {
        console.error("aegis start failed", e);
        const host = document.getElementById("aegis-host");
        host.style.display = "grid";
        host.style.placeItems = "center";
        host.style.color = "#d05a5a";
        host.style.font = "13px ui-monospace, SFMono-Regular, monospace";
        host.textContent = `aeGIS failed to start: ${e}`;
      }
    }
    main();
  </script>
</body>
</html>
