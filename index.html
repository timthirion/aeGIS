<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aeGIS</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0e12;
      color: #e6e8eb;
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
    }
    header, footer {
      padding: 12px 18px;
    }
    header {
      border-bottom: 1px solid #1d232b;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header .tag {
      font-size: 12px;
      color: #8d97a3;
      font-variant-numeric: tabular-nums;
    }
    main {
      position: relative;
      overflow: hidden;
    }
    #aegis-host {
      position: absolute;
      inset: 0;
    }
    #aegis-host canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      /* Stop the browser from intercepting touch gestures for page
         scroll / pinch-zoom — pointer events handle them. */
      touch-action: none;
    }
    #aegis-host canvas:active { cursor: grabbing; }

    /* Bottom-left basemap toggle. Two buttons act as a segmented
       control: the active mode reads as a filled pill, the inactive
       one as a ghost button. Sits inside the canvas's positioned
       container so it floats over the render surface. */
    #basemap-toggle {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      display: inline-flex;
      padding: 3px;
      background: rgba(11, 14, 18, 0.78);
      border: 1px solid #1d232b;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      font: 12px/1 ui-sans-serif, system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    #basemap-toggle button {
      appearance: none;
      border: none;
      background: transparent;
      color: #8d97a3;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      letter-spacing: 0.02em;
      transition: background-color 120ms, color 120ms;
    }
    #basemap-toggle button:hover { color: #e6e8eb; }
    #basemap-toggle button[aria-pressed="true"] {
      background: #2a3340;
      color: #e6e8eb;
    }
    footer {
      border-top: 1px solid #1d232b;
      font-size: 12px;
      color: #8d97a3;
    }
    footer a { color: #9cb2cf; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>aeGIS</h1>
    <span class="tag" id="version-tag">loading…</span>
  </header>
  <main>
    <div id="aegis-host"></div>
    <div id="basemap-toggle" role="group" aria-label="Basemap">
      <button type="button" data-mode="map" aria-pressed="true">Map</button>
      <button type="button" data-mode="satellite" aria-pressed="false">Satellite</button>
    </div>
  </main>
  <footer>
    <span>aeGIS · Open-source GIS in Rust + WebGPU</span>
    &nbsp;·&nbsp;
    <a href="https://github.com/timthirion/aeGIS">github.com/timthirion/aeGIS</a>
    &nbsp;·&nbsp;
    Map © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors,
    © <a href="https://carto.com/attributions">CARTO</a>
    &nbsp;·&nbsp;
    Satellite: <a href="https://s2maps.eu">Sentinel-2 cloudless</a> by
    <a href="https://eox.at">EOX IT Services GmbH</a> (CC BY 4.0)
  </footer>
  <script type="module">
    import init, { start, version } from "./pkg/aegis.js";

    // The AegisInstance handle owns every Rust-side Closure (the rAF
    // tick, the ResizeObserver callback, every pointer + wheel
    // listener). Letting it go out of scope = JS garbage-collects it
    // = every Closure gets dropped = the next ResizeObserver / pointer
    // / wheel event explodes with "closure invoked recursively or
    // after being dropped". Hold it in a module-scoped binding so it
    // lives as long as the page does.
    let aegis;

    async function main() {
      await init();
      document.getElementById("version-tag").textContent = `v${version()}`;
      try {
        aegis = await start("aegis-host");
        wireBasemapToggle(aegis);
      } catch (e) {
        console.error("aegis start failed", e);
        const host = document.getElementById("aegis-host");
        host.style.display = "grid";
        host.style.placeItems = "center";
        host.style.color = "#d05a5a";
        host.style.font = "13px ui-monospace, SFMono-Regular, monospace";
        host.textContent = `aeGIS failed to start: ${e}`;
      }
    }

    function wireBasemapToggle(instance) {
      const toggle = document.getElementById("basemap-toggle");
      const buttons = Array.from(toggle.querySelectorAll("button"));
      // Sync the UI to whatever the renderer's actual mode is at
      // startup (so the initial pressed state isn't a lie if the
      // default changes Rust-side).
      const current = instance.basemap();
      buttons.forEach((b) =>
        b.setAttribute("aria-pressed", b.dataset.mode === current ? "true" : "false"),
      );
      toggle.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-mode]");
        if (!btn) return;
        const mode = btn.dataset.mode;
        instance.setBasemap(mode);
        buttons.forEach((b) =>
          b.setAttribute("aria-pressed", b.dataset.mode === mode ? "true" : "false"),
        );
      });
    }
    main();
  </script>
</body>
</html>
