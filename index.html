<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aeGIS</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0e12;
      color: #e6e8eb;
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
    }
    header, footer {
      padding: 12px 18px;
    }
    header {
      border-bottom: 1px solid #1d232b;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header .tag {
      font-size: 12px;
      color: #8d97a3;
      font-variant-numeric: tabular-nums;
    }
    /* Body switcher — four emoji icon buttons in the header next
       to the title. The active body's icon scales up slightly so
       the selection state is unmistakable. */
    #aegis-body-switcher {
      display: inline-flex;
      gap: 4px;
      margin-left: auto;
      padding: 2px;
      border: 1px solid #1d232b;
      border-radius: 999px;
      background: rgba(20, 22, 26, 0.5);
    }
    #aegis-body-switcher button {
      appearance: none;
      border: none;
      background: transparent;
      width: 30px;
      height: 26px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0;
      transition: background-color 120ms, transform 120ms;
      /* Force colour-emoji rendering on platforms whose default
         system font would otherwise replace these with monochrome
         glyphs. */
      font-family: "Apple Color Emoji", "Segoe UI Emoji",
                   "Noto Color Emoji", emoji, sans-serif;
    }
    #aegis-body-switcher button:hover {
      background: #2a3340;
    }
    #aegis-body-switcher button[aria-pressed="true"] {
      background: #2a3340;
      transform: scale(1.08);
    }
    main {
      position: relative;
      overflow: hidden;
    }
    #aegis-host {
      position: absolute;
      inset: 0;
    }
    #aegis-host canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      /* Stop the browser from intercepting touch gestures for page
         scroll / pinch-zoom — pointer events handle them. */
      touch-action: none;
    }
    #aegis-host canvas:active { cursor: grabbing; }

    /* Bottom-left basemap toggle. Two buttons act as a segmented
       control: the active mode reads as a filled pill, the inactive
       one as a ghost button. Sits inside the canvas's positioned
       container so it floats over the render surface. */
    #basemap-toggle {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      display: inline-flex;
      padding: 3px;
      background: rgba(11, 14, 18, 0.78);
      border: 1px solid #1d232b;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      font: 12px/1 ui-sans-serif, system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    #basemap-toggle button {
      appearance: none;
      border: none;
      background: transparent;
      color: #8d97a3;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      letter-spacing: 0.02em;
      transition: background-color 120ms, color 120ms;
    }
    #basemap-toggle button:hover { color: #e6e8eb; }
    #basemap-toggle button[aria-pressed="true"] {
      background: #2a3340;
      color: #e6e8eb;
    }

    /* Satellite-category pills (plan 0004 M2). Same chrome palette
       as the basemap toggle. Earth-only — hidden on other bodies
       via the same data-body gate the search bar uses. */
    #aegis-orbit-categories {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      display: inline-flex;
      padding: 3px;
      background: rgba(11, 14, 18, 0.78);
      border: 1px solid #1d232b;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      font: 12px/1 ui-sans-serif, system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    #aegis-orbit-categories button {
      appearance: none;
      border: none;
      background: transparent;
      color: #8d97a3;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      letter-spacing: 0.02em;
      transition: background-color 120ms, color 120ms, opacity 120ms;
    }
    #aegis-orbit-categories button:hover { color: #e6e8eb; }
    #aegis-orbit-categories button[aria-pressed="true"] {
      background: #2a3340;
      color: #e6e8eb;
    }
    #aegis-orbit-categories button[data-demoted="true"] {
      opacity: 0.45;
      cursor: not-allowed;
    }
    /* Hidden when not on Earth — same data-body gate the search uses. */
    body:not([data-body="earth"]) #aegis-orbit-categories { display: none; }

    /* Top-centre search bar. Same chrome palette as the basemap
       toggle (panel background, border, blur). The input has no
       native border so it reads as a continuation of the chrome
       rather than a form field. The dropdown is created from Rust
       and dropped in as a sibling of the input on first match. */
    #aegis-search {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(480px, calc(100% - 32px));
      z-index: 10;
      background: rgba(11, 14, 18, 0.78);
      border: 1px solid #1d232b;
      border-radius: 8px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      font: 14px/1.3 ui-sans-serif, system-ui, -apple-system, sans-serif;
      user-select: none;
      color: #e6e8eb;
    }
    /* Search is Earth-only for now (Photon/Nominatim only know
       Earth places); the bar hides itself on the other bodies.
       Toggled via the `data-body` attribute on <body> from
       wireBodySwitcher. */
    body:not([data-body="earth"]) #aegis-search { display: none; }
    #aegis-search input {
      appearance: none;
      width: 100%;
      box-sizing: border-box;
      border: none;
      background: transparent;
      color: #e6e8eb;
      padding: 10px 14px;
      font: inherit;
      letter-spacing: 0.01em;
      outline: none;
    }
    #aegis-search input::placeholder { color: #6a7480; }
    #aegis-search-results {
      border-top: 1px solid #1d232b;
      max-height: 320px;
      overflow-y: auto;
    }
    #aegis-search-results:empty { display: none; }
    #aegis-search-results > div[role="option"] {
      padding: 8px 14px;
      cursor: pointer;
      border-bottom: 1px solid #14181d;
    }
    #aegis-search-results > div[role="option"]:last-child {
      border-bottom: none;
    }
    #aegis-search-results > div[role="option"]:hover,
    #aegis-search-results > div[role="option"][aria-selected="true"] {
      background: #2a3340;
    }
    #aegis-search-results .row-name {
      color: #e6e8eb;
      font-weight: 500;
    }
    #aegis-search-results .row-context {
      color: #8d97a3;
      font-size: 12px;
      margin-top: 2px;
    }

    footer {
      border-top: 1px solid #1d232b;
      font-size: 12px;
      color: #8d97a3;
    }
    footer a { color: #9cb2cf; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>aeGIS</h1>
    <span class="tag" id="version-tag">loading…</span>
    <div id="aegis-body-switcher" role="group" aria-label="Body">
      <button type="button" data-body="earth" aria-pressed="true" title="Earth">🌍</button>
      <button type="button" data-body="mars" aria-pressed="false" title="Mars">🔴</button>
      <button type="button" data-body="moon" aria-pressed="false" title="Moon">🌙</button>
    </div>
  </header>
  <main>
    <div id="aegis-host"></div>
    <div id="aegis-search" role="combobox" aria-haspopup="listbox" aria-expanded="false">
      <input
        type="text"
        id="aegis-search-input"
        placeholder="Search a place or paste coordinates"
        autocomplete="off"
        spellcheck="false"
      />
      <div id="aegis-search-results" role="listbox"></div>
    </div>
    <div id="basemap-toggle" role="group" aria-label="Basemap">
      <button type="button" data-mode="map" aria-pressed="false">Map</button>
      <button type="button" data-mode="satellite" aria-pressed="true">Satellite</button>
    </div>
    <div id="aegis-orbit-categories" role="group" aria-label="Satellite categories">
      <button type="button" data-cat="stations" aria-pressed="true" title="Stations (ISS, Tiangong)">Stations</button>
      <button type="button" data-cat="starlink" aria-pressed="false" title="Starlink (~6000 sats)">Starlink</button>
      <button type="button" data-cat="gnss" aria-pressed="false" title="GPS / GLONASS / Galileo / BeiDou">GNSS</button>
      <button type="button" data-cat="weather" aria-pressed="false" title="Weather + Earth-observation">Weather</button>
    </div>
  </main>
  <footer>
    <span>aeGIS · Open-source GIS in Rust + WebGPU</span>
    &nbsp;·&nbsp;
    <a href="https://github.com/timthirion/aeGIS">github.com/timthirion/aeGIS</a>
    &nbsp;·&nbsp;
    Map © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors,
    © <a href="https://carto.com/attributions">CARTO</a>
    &nbsp;·&nbsp;
    Satellite: Source:
    <a href="https://www.esri.com/en-us/legal/copyright-trademarks">Esri</a>,
    Maxar, Earthstar Geographics, and the GIS User Community
  </footer>
  <script type="module">
    import init, { start, version } from "./pkg/aegis.js";

    // The AegisInstance handle owns every Rust-side Closure (the rAF
    // tick, the ResizeObserver callback, every pointer + wheel
    // listener). Letting it go out of scope = JS garbage-collects it
    // = every Closure gets dropped = the next ResizeObserver / pointer
    // / wheel event explodes with "closure invoked recursively or
    // after being dropped". Hold it in a module-scoped binding so it
    // lives as long as the page does.
    let aegis;

    async function main() {
      await init();
      document.getElementById("version-tag").textContent = `v${version()}`;
      try {
        aegis = await start("aegis-host");
        wireBasemapToggle(aegis);
        wireBodySwitcher(aegis);
        wireOrbitCategories(aegis);
      } catch (e) {
        console.error("aegis start failed", e);
        const host = document.getElementById("aegis-host");
        host.style.display = "grid";
        host.style.placeItems = "center";
        host.style.color = "#d05a5a";
        host.style.font = "13px ui-monospace, SFMono-Regular, monospace";
        host.textContent = `aeGIS failed to start: ${e}`;
      }
    }

    function wireBodySwitcher(instance) {
      const switcher = document.getElementById("aegis-body-switcher");
      if (!switcher) return;
      const buttons = Array.from(switcher.querySelectorAll("button"));
      const syncToBody = (active) => {
        buttons.forEach((b) =>
          b.setAttribute("aria-pressed", b.dataset.body === active ? "true" : "false"),
        );
        // The CSS keys "hide the search bar on non-Earth bodies" off
        // this attribute. Setting it on <body> lets a single
        // selector govern the search bar's visibility without
        // adding per-component show/hide JS.
        document.body.setAttribute("data-body", active);
      };
      // Sync initial state from the renderer.
      syncToBody(instance.body());
      switcher.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-body]");
        if (!btn) return;
        const body = btn.dataset.body;
        instance.setBody(body);
        syncToBody(body);
        // Body switch resets the basemap to the new body's default;
        // re-sync the basemap toggle so its pressed state matches.
        const basemapToggle = document.getElementById("basemap-toggle");
        if (basemapToggle) {
          const current = instance.basemap();
          basemapToggle.querySelectorAll("button").forEach((b) =>
            b.setAttribute("aria-pressed", b.dataset.mode === current ? "true" : "false"),
          );
        }
      });
    }

    function wireOrbitCategories(instance) {
      const root = document.getElementById("aegis-orbit-categories");
      if (!root) return;
      const buttons = Array.from(root.querySelectorAll("button[data-cat]"));
      const syncState = () => {
        const demoted = instance.orbitDemoted();
        buttons.forEach((b) => {
          const cat = b.dataset.cat;
          const enabled = instance.orbitCategoryEnabled(cat);
          b.setAttribute("aria-pressed", enabled ? "true" : "false");
          b.setAttribute("data-demoted", cat === demoted ? "true" : "false");
        });
      };
      // Sync initial state — Stations is on by default Rust-side.
      syncState();
      root.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-cat]");
        if (!btn) return;
        const cat = btn.dataset.cat;
        const next = btn.getAttribute("aria-pressed") !== "true";
        instance.setOrbitCategory(cat, next);
        syncState();
      });
      // Demoted-state can change as TLEs stream in; poll a bit
      // after each click for the budget guard to settle.
      setInterval(syncState, 2000);
    }

    function wireBasemapToggle(instance) {
      const toggle = document.getElementById("basemap-toggle");
      const buttons = Array.from(toggle.querySelectorAll("button"));
      // Sync the UI to whatever the renderer's actual mode is at
      // startup (so the initial pressed state isn't a lie if the
      // default changes Rust-side).
      const current = instance.basemap();
      buttons.forEach((b) =>
        b.setAttribute("aria-pressed", b.dataset.mode === current ? "true" : "false"),
      );
      toggle.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-mode]");
        if (!btn) return;
        const mode = btn.dataset.mode;
        instance.setBasemap(mode);
        buttons.forEach((b) =>
          b.setAttribute("aria-pressed", b.dataset.mode === mode ? "true" : "false"),
        );
      });
    }
    main();
  </script>
</body>
</html>
